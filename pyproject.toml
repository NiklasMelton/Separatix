[project]
name = "separatix"
version = "0.1.1"
description = "Diagnostic profiling of supervised feature spaces before model training."
authors = [{ name = "Niklas Melton", email = "niklas@example.com" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9,<3.15"
dependencies = [
    "numpy>=1.23,<2.1; python_version < '3.11'",
    "numpy>=1.26.4,<2.5; python_version >= '3.11'",
    "scipy>=1.9,<1.14; python_version < '3.11'",
    "scipy>=1.10,<1.18; python_version >= '3.11'",
    "scikit-learn>=1.2,<1.7; python_version < '3.11'",
    "scikit-learn>=1.4,<1.10; python_version >= '3.11'",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
tda = ["ripser>=0.6"]
multilabel = ["iterative-stratification>=0.1.9"]
mlp = ["torch>=2.1"]
examples = ["matplotlib>=3.6", "pandas>=1.5"]

[tool.poetry]
license = "AGPL-3.0-or-later"
packages = [{ include = "separatix" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.5"
mypy = ">=1"
build = ">=1"
twine = ">=5"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.2,<9"
furo = ">=2024.8.6"
myst-parser = ">=3,<5"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
