name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: |
          poetry config installer.only-binary numpy,scipy,scikit-learn
          poetry sync --with dev

      - name: Run Ruff lint
        run: poetry run ruff check separatix tests

      - name: Run Ruff format check
        run: poetry run ruff format --check separatix tests

      - name: Run mypy
        run: poetry run mypy separatix

      - name: Validate package metadata
        run: poetry check

  pytest:
    name: pytest (base, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: |
          poetry config installer.only-binary numpy,scipy,scikit-learn
          poetry sync --with dev

      - name: Verify scientific stack
        run: poetry run python -c "import numpy, scipy, scipy.spatial.transform, sklearn; print('numpy={}, scipy={}, scikit-learn={}'.format(numpy.__version__, scipy.__version__, sklearn.__version__))"

      - name: Run pytest
        run: poetry run pytest

  optional-extra:
    name: ${{ matrix.name }} (py3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pandas input
            extra: pandas
            tests: tests/test_validation.py tests/test_api.py
          - name: iterative multilabel stratification
            extra: multilabel
            tests: tests/test_multilabel_sampling.py
          - name: persistent topology
            extra: tda
            tests: tests/test_optional_topology.py tests/test_multilabel_topology.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install optional dependency
        run: |
          poetry config installer.only-binary numpy,scipy,scikit-learn
          poetry sync --with dev -E ${{ matrix.extra }}

      - name: Assert iterative stratifier is installed
        if: matrix.extra == 'multilabel'
        run: poetry run python -c "from iterstrat.ml_stratifiers import MultilabelStratifiedKFold; assert MultilabelStratifiedKFold"

      - name: Run optional-path tests
        run: poetry run pytest ${{ matrix.tests }}

  cpu-mlp-extra:
    name: CPU-only MLP extra (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install base dependencies
        run: |
          poetry config installer.only-binary numpy,scipy,scikit-learn
          poetry sync --with dev

      - name: Install CPU-only PyTorch
        run: poetry run pip install 'torch>=2.1' --index-url https://download.pytorch.org/whl/cpu

      - name: Run MLP tests
        run: poetry run pytest tests/test_mlp_probes.py

  all-extras-coverage:
    name: all extras and coverage (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies except PyTorch
        run: |
          poetry config installer.only-binary numpy,scipy,scikit-learn
          poetry sync --with dev -E pandas -E tda -E multilabel -E examples

      - name: Install CPU-only PyTorch
        run: poetry run pip install 'torch>=2.1' --index-url https://download.pytorch.org/whl/cpu

      - name: Run all tests with coverage
        run: poetry run pytest --cov=separatix --cov-report=term-missing --cov-fail-under=80

      - name: Enforce optional MLP coverage
        run: poetry run coverage report --include='separatix/models/mlp.py' --fail-under=70
